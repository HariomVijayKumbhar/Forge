# ============================================================================
# Forge Full Stack — Render Blueprint (render.yaml)
# ============================================================================
# Deploys:
#   1. forge-backend  — Web Service (FastAPI / Python)
#   2. forge-frontend — Static Site (Next.js Static Export on Render CDN)
#
# How to use:
#   1. Push code to GitHub.
#   2. In Render: Dashboard > New > Blueprint > select your repo.
#   3. Render auto-detects both services:
#        - forge-backend (Web Service)
#        - forge-frontend (Static Site)
#   4. Fill in secrets marked sync: false in forge-backend > Environment tab.
# ============================================================================

services:
  # ==========================================================================
  # 1. Backend API (Web Service)
  # ==========================================================================
  - type: web
    name: forge-backend
    runtime: python
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- App ---
      - key: APP_NAME
        value: Forge Autonomous Agent
      - key: DEBUG
        value: "false"

      # --- Security / Auth ---
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_HOURS
        value: "8"
      - key: ALLOWED_ORIGINS
        value: https://forge34.onrender.com,https://forge-frontend.onrender.com,https://forge-phi-navy.vercel.app,http://localhost:3000
      - key: ACCESS_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false

      # --- LLM Providers ---
      - key: LLM_PROVIDER_CHAIN
        value: groq,openrouter
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-20241022
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # --- Sandbox (no Docker daemon on Render -> subprocess fallback) ---
      - key: MAX_ITERATIONS
        value: "25"
      - key: RUN_TIMEOUT_SECONDS
        value: "600"
      - key: CONSECUTIVE_FAILURES_LIMIT
        value: "3"
      - key: ENABLE_DOCKER_SANDBOX
        value: "false"
      - key: SANDBOX_DOCKER_IMAGE
        value: python:3.12-slim
      - key: SANDBOX_TEMP_ROOT
        value: ./sandbox_workspaces

      # --- GitHub ---
      - key: GITHUB_TOKEN
        sync: false

      # --- Database (Supabase Postgres) ---
      # Session pooler IPv4 string from Supabase
      - key: DATABASE_URL
        sync: false

  # ==========================================================================
  # 2. Frontend Web App (Static Site)
  # ==========================================================================
  - type: static
    name: forge-frontend
    rootDir: frontend
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: forge-backend
          envVarKey: RENDER_EXTERNAL_URL
